# CPU Universal Image Python Dependencies
#
# To regenerate requirements.txt:
#   uv pip compile --python-platform=linux --python-version=3.12 \
#     --index-strategy=unsafe-best-match \
#     --index-url=https://console.redhat.com/api/pypi/public-rhai/rhoai/3.6-EA1/cpu-ubi9/simple/ \
#     -o requirements.txt pyproject.toml
#

[project]
name = "th-torch-cpu-universal-image"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # ===================================================================
    # ML/AI DEPENDENCIES (added on top of base image)
    # Base image deps are NOT listed here - pip install is additive
    # Strict AIPCC-only: all packages must be available in AIPCC index
    # ===================================================================
    
    # PyTorch CPU version
    "torch==2.11.0",
    
    # Triton (CPU compatible for JIT compilation)
    "triton==3.6.0",
    
    # ML Training and Inference Libraries
    "accelerate==1.14.0",
    "transformers==5.15.0",
    "peft==0.20.0",
    "datasets==5.0.1",
    "trl==1.10.0",
    
    # Deep Learning Utilities (CPU-compatible)
    "einops==0.8.2",
    "numba==0.67.0",
    
    # Tokenization
    "sentencepiece==0.2.2",
    "tokenizers==0.22.2",
    
    # Core Dependencies
    "numpy>=2.0.0",
    "tqdm>=4.67.1",
    "pydantic>=2.11.7",
    "protobuf==6.33.6",
    "safetensors==0.8.0",
    "py-cpuinfo>=9.0.0",
    "rich>=13.9.4",
    "aiofiles==25.1.0",
    "tensorboard==2.20.0",
    
    # Storage & MLOps
    "s3fs==2025.9.0",
    "mlflow==3.15.1",
    
    # Training Frameworks
    "training_hub==0.9.8",
    "instructlab-training==0.16.2",
    "rhai-innovation-mini-trainer==0.9.0",
    
    # Kubeflow SDK
    "kubeflow==0.4.1+rhaiv.0",
    "kubeflow_spark_api==2.4.0",
    "pyspark_connect==4.2.0",

    # OpenPipe ART
    "openpipe-art==0.5.18",
    
    # Model Management
    "model_registry==0.3.14",
    
    # Note: GPU-specific packages are NOT included:
    # - flash-attn (requires CUDA/ROCm)
    # - bitsandbytes (GPU-focused)
    # - liger-kernel (GPU-focused)
    # - deepspeed (primarily for GPU training)
    # - causal-conv1d, mamba-ssm (require CUDA)
    # - xformers (GPU-focused)
    # - vllm (GPU inference)
    # - unsloth (GPU-focused)
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython'",
]
index-strategy = "unsafe-best-match"
index-url = "https://console.redhat.com/api/pypi/public-rhai/rhoai/3.6-EA1/cpu-ubi9/simple/"
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "gitpython>=3.1.52",
    "pillow>=12.3.0",
    "pyasn1>=0.6.4",
    "starlette>=1.3.1",
    "openai<3.0",  # Required for openpipe-art vllm runtime compatibility
]
