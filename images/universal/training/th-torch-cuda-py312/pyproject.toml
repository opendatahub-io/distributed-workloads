# CUDA Universal Image Python Dependencies
#
# To regenerate requirements.txt:
#   uv pip compile --python-platform=linux --python-version=3.12 \
#     --index-strategy=unsafe-best-match \
#     --index-url=https://console.redhat.com/api/pypi/public-rhai/rhoai/3.6-EA1/cuda13.0-ubi9/simple/ \
#     -o requirements.txt pyproject.toml
#
# Note: override-dependencies and constraint-dependencies are in [tool.uv] below.
#
# Overrides needed: mamba-ssm pins tilelang==0.1.9 and apache-tvm-ffi<=0.1.9 but vllm needs 0.1.9 and 0.1.10 respectively.
#

[project]
name = "th-torch-cuda-universal-image"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # ===================================================================
    # ML/AI DEPENDENCIES (added on top of base image)
    # Base image deps are NOT listed here - pip install is additive
    # Strict AIPCC-only: all packages must be available in AIPCC index
    # ===================================================================
    
    # PyTorch with CUDA 13.0
    "torch==2.11.0",
    
    # Triton (GPU kernel compiler)
    "triton==3.6.0",
    
    # xformers (efficient transformers)
    "xformers==0.0.35",
    
    # ML Training and Inference Libraries
    "accelerate==1.14.0",
    "transformers==5.15.0",
    "peft==0.20.0",
    "datasets==5.0.1",
    
    # Core Dependencies
    "tqdm>=4.67.1",
    "pydantic>=2.11.7",
    "aiofiles==25.1.0",
    "deprecated>=1.2.18",
    "typer>=0.19.2",
    "protobuf>=3.20.0",
    "safetensors==0.8.0",
    "py-cpuinfo>=9.0.0",
    
    # Deep Learning Utilities
    "numpy>=2.0.0",
    "rich>=13.9.4",
    "tensorboard==2.20.0",
    "bitsandbytes==0.50.1",
    "liger-kernel==0.8.1",
    "einops==0.8.2",
    "kernels==0.16.0",
    
    # Tokenization
    "sentencepiece==0.2.2",
    "tokenizers==0.22.2",
    
    # Training Libraries
    "trl==1.10.0",
    "deepspeed==0.19.5",
    
    # MLOps
    "mlflow==3.15.1",
    
    # Storage
    "s3fs==2025.9.0",
    
    # Training Frameworks
    "training_hub[lora,cuda,grpo]==0.9.8",
    "instructlab-training==0.16.2",
    "rhai-innovation-mini-trainer==0.9.0",
    "unsloth==2026.8.18+rhaiv.0",
    "unsloth-zoo==2026.8.12+rhaiv.0",
    
    # Kubeflow SDK
    "kubeflow==0.4.1+rhaiv.0",
    "kubeflow_spark_api==2.4.0",
    "pyspark_connect==4.2.0",
    
    # Model Management
    "model_registry==0.3.14",
    
    # Flash Attention (pre-built wheel from AIPCC)
    "flash-attn==2.8.3.post1",
    
    # Mamba dependencies (pre-built wheels from AIPCC)
    "causal-conv1d==1.6.2.post1",
    "mamba-ssm==2.3.2.post1",
    
    # OpenPipe ART
    "openpipe-art==0.5.18",
    
    # Inference
    "vllm==0.26.0+rhaiv.1",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython'",
]
index-strategy = "unsafe-best-match"
index-url = "https://console.redhat.com/api/pypi/public-rhai/rhoai/3.6-EA1/cuda13.0-ubi9/simple/"
override-dependencies = [
    "numba==0.65.0",
    "llvmlite==0.47.0",
    "apache-tvm-ffi==0.1.10",
    "tilelang==0.1.9",
    "protobuf==6.33.6",
    "numpy==2.4.6"
]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "gitpython>=3.1.52",
    "pillow>=12.3.0",
    "pyasn1>=0.6.4",
    "starlette>=1.3.1",
    "openai<3.0",  # Required for openpipe-art vllm runtime compatibility
]
