# CUDA Universal Image Python Dependencies
#
# To regenerate requirements.txt:
#   uv pip compile --python-platform=linux --python-version=3.12 \
#     --index-strategy=unsafe-best-match \
#     --index-url=https://console.redhat.com/api/pypi/public-rhai/rhoai/3.6/cuda13.0-ubi9/simple/ \
#     -o requirements.txt pyproject.toml
#
# Note: override-dependencies and constraint-dependencies are in [tool.uv] below.
#
# Overrides needed: vllm pins numba==0.65.0, tilelang==0.1.12, apache-tvm-ffi==0.1.11 while mamba-ssm pins tilelang==0.1.8, apache-tvm-ffi<=0.1.9; overrides follow the versions validated on main.
#

[project]
name = "th-torch-cuda-universal-image"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # ===================================================================
    # ML/AI DEPENDENCIES (added on top of base image)
    # Base image deps are NOT listed here - pip install is additive
    # Strict AIPCC-only: all packages must be available in AIPCC index
    # ===================================================================
    
    # PyTorch with CUDA 13.0
    "torch==2.13.0",
    
    # Triton (GPU kernel compiler)
    "triton==3.7.1",
    
    # xformers (efficient transformers)
    "xformers==0.0.35",
    
    # ML Training and Inference Libraries
    "accelerate>=1.15.0",
    "transformers==5.17.0",
    "peft==0.20.0",
    "datasets==5.0.1",
    
    # Core Dependencies
    "tqdm>=4.70.0",
    "pydantic>=2.13.4",
    "aiofiles==25.1.0",
    "deprecated>=1.3.1",
    "typer>=0.27.2",
    "protobuf>=7.36.1",
    "safetensors==0.8.0",
    "py-cpuinfo>=9.0.0",
    
    # Deep Learning Utilities
    "numpy>=2.4.6",
    "rich>=15.0.0",
    "tensorboard==2.20.0",
    "bitsandbytes==0.50.2",
    "liger-kernel==0.8.1",
    "einops==0.8.2",
    "kernels==0.16.1",
    
    # Tokenization
    "sentencepiece==0.2.2",
    "tokenizers==0.23.2",
    
    # Training Libraries
    "trl==1.13.0",
    "deepspeed==0.19.5",
    
    # MLOps
    "mlflow==3.16.0",
    
    # Storage
    "s3fs==2026.6.0",
    
    # Training Frameworks
    "training_hub[lora,cuda,grpo]==0.11.2",
    "instructlab-training==0.16.2",
    "rhai-innovation-mini-trainer==0.9.0",
    "unsloth==2026.10.19+rhaiv.0",
    # unsloth imports unsloth_zoo unconditionally but only declares it under extras,
    # so pin it explicitly to the RHAI fork build matching the unsloth release.
    "unsloth-zoo==2026.10.19+rhaiv.0",

    
    # Kubeflow SDK
    "kubeflow==0.5.0+rhaiv.0",
    "kubeflow_spark_api==2.4.0",
    "pyspark_connect==4.2.0",
    
    # Model Management
    "model_registry==0.3.14",
    
    # Flash Attention (pre-built wheel from AIPCC)
    "flash-attn==2.8.3.post1",
    
    # Mamba dependencies (pre-built wheels from AIPCC)
    "causal-conv1d==1.7.0",
    "mamba-ssm==2.3.2.post1",
    
    # OpenPipe ART
    "openpipe-art==0.5.18",
    
    # Inference
    "vllm==0.31.0+rhaiv.2",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython'",
]
index-strategy = "unsafe-best-match"
index-url = "https://console.redhat.com/api/pypi/public-rhai/rhoai/3.6/cuda13.0-ubi9/simple/"
override-dependencies = [
    "numba==0.67.0",
    "llvmlite==0.49.0",
    "apache-tvm-ffi==0.1.10",
    "tilelang==0.1.12",
    "protobuf==7.36.1",
    "numpy==2.4.6",
    "litellm==1.102.2"
]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.15.1",
    "gitpython>=3.2.0",
    "pillow>=13.0.0",
    "pyasn1>=0.6.4",
    "pyjwt>=2.15.0",
    "sqlparse>=0.6.0",
    "starlette>=1.6.0",
    "openai==2.54.0",  # Required for openpipe-art vllm runtime compatibility
    "fsspec>=2026.6.0",
    "graphql-core>=3.2.12",
    "urllib3>=2.8.0",
    "msgpack>=1.2.3",
    "dnspython>=2.9.0",
    "wrapt>=2.2.2",
]
