pull_request_rules:
  - name: Request changes when torch-cpu ITS check fails or is pending
    conditions:
      - -closed
      - or:
          - check-failure=Red Hat Konflux / distributed-workloads-its-manual / odh-th-torch-cpu-py312-ci
          - check-pending=Red Hat Konflux / distributed-workloads-its-manual / odh-th-torch-cpu-py312-ci
    actions:
      review:
        type: REQUEST_CHANGES
        message: >-
          The odh-th-torch-cpu-py312-ci integration test check is failing or still
          pending. This PR cannot be merged until it passes.
  - name: Auto-approve lake-gate PRs
    conditions:
      - base=stable
      - label=lake-gate
      - -closed
      - author=github-actions[bot]
    actions:
      review:
        type: APPROVE
  - name: Auto-merge lake-gate PRs to stable
    conditions:
      - base=stable
      - label=lake-gate
      - -closed
      - author=github-actions[bot]
      - "#approved-reviews-by>=1"
    actions:
      merge:
        method: fast-forward
