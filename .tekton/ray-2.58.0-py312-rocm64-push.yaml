apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/distributed-workloads?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch == "main"
      && ( "images/runtime/ray/rocm/2.58.0-py312-rocm64/**".pathChanged()
            || ".tekton/ray-2.58.0-py312-rocm64-push.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: distributed-workloads
    appstudio.openshift.io/component: odh-ray-2-58-0-py312-rocm64-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-ray-2-58-0-py312-rocm64-on-push
  namespace: open-data-hub-tenant
spec:
  timeouts:
    pipeline: 10h
    tasks: 8h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/modh/ray:2.58.0-py312-rocm64
  - name: additional-tags
    value:
    - '2.58.0-py312-rocm64-{{revision}}'
  - name: dockerfile
    value: Dockerfile
  - name: path-context
    value: images/runtime/ray/rocm/2.58.0-py312-rocm64
  - name: pipeline-type
    value: push
  - name: build-source-image
    value: "false"
  - name: build-platforms
    value:
    - linux-extra-fast/amd64
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunSpecs:
  - pipelineTaskName: build-images
    stepSpecs:
    - name: build
      computeResources:
        requests:
          memory: 10Gi
        limits:
          memory: 10Gi
    - name: prepare-sboms
      computeResources:
        requests:
          cpu: '3'
          memory: 8Gi
        limits:
          cpu: '3'
          memory: 8Gi
    - name: sbom-syft-generate
      computeResources:
        requests:
          cpu: '2'
          memory: 8Gi
        limits:
          cpu: '2'
          memory: 8Gi
  - pipelineTaskName: prefetch-dependencies
    computeResources:
      requests:
        cpu: '1'
        memory: 2Gi
      limits:
        memory: 2Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-ray-2-58-0-py312-rocm64-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
